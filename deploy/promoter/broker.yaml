# A promoter broker fleet: brokers announce themselves to 255.255.255.255:63000
# and every service with a UDPClusterManager folds them in as they appear.
#
# Use this recipe on a network that DELIVERS BROADCAST — bare metal, VMs, a
# Docker bridge, a laptop. Most Kubernetes overlays and every GCP VPC drop it;
# there, use deploy/unicaster/ instead. Nothing else about the manifest changes.
#
# Scaling this StatefulSet IS the scaling operation. Nothing is restarted or
# reconfigured: a new broker announces within one interval, and a removed one is
# dropped as soon as its `down` arrives.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: imq-broker
spec:
  serviceName: imq-broker
  replicas: 3
  selector:
    matchLabels: { app: imq-broker }
  template:
    metadata:
      labels: { app: imq-broker }
    spec:
      containers:
        - name: redis
          image: ghcr.io/imqueue/redis-broker:7.4
          ports:
            - { name: redis, containerPort: 6379 }
            - { name: discovery, containerPort: 63000, protocol: UDP }
          env:
            - { name: IMQ_BROKER_MODE, value: promoter }
            # Distinct per fleet. Announcements are NOT filtered by queue name,
            # so two fleets sharing a segment and a name discover each other's
            # brokers — see THREAT-MODEL.md.
            - { name: REDIS_BROADCAST_NAME, value: imq-broker }
            - { name: IMQ_PERSISTENCE, value: rdb }
            - name: IMQ_REQUIREPASS_FILE
              value: /run/secrets/imq/password
          volumeMounts:
            - { name: secret, mountPath: /run/secrets/imq, readOnly: true }
            - { name: data, mountPath: /data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$(cat /run/secrets/imq/password)\" --no-auth-warning ping"]
            initialDelaySeconds: 2
      volumes:
        # One password for the WHOLE fleet. Per-entry cluster credentials are
        # ignored client side, so a broker with its own secret is discovered and
        # then unreachable — see README, "Authentication".
        - name: secret
          secret: { secretName: imq-broker-password }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: imq-broker
spec:
  clusterIP: None          # headless: services reach brokers by the announced pod IP
  selector: { app: imq-broker }
  ports:
    - { name: redis, port: 6379 }
