# Publishes to GHCR on a tag. GHCR rather than Docker Hub: no pull rate limits,
# no separate account, and the package inherits the repository's visibility.
#
# The matrix here IS the support promise — every tag published is one this
# project commits to rebuilding when a CVE lands in Redis or in a runtime
# library. Adding a row is a maintenance commitment, not a convenience.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        redis: ['7.2', '7.4']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0        # git describe needs the tags, for the dispatch path

      # arm64 is not optional: the first thing anyone does with this image is
      # `docker run` it on a laptop, and most of those are Apple silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag push GITHUB_REF_NAME is `v1.2.3`; on workflow_dispatch it is the
      # BRANCH, which would publish `7.4-master`. Fall back to the newest tag so a
      # manual re-run republishes the same version rather than inventing one.
      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v="$(git describe --tags --abbrev=0 | sed 's/^v//')"; fi

          # The immutable tag is always published. The FLOATING tag is published
          # only when this is the newest version, because a floating tag must
          # never move backwards.
          #
          # Learned the hard way on 2026-08-22: force-pushing v1.0.0/v1.0.1/v1.1.0
          # re-triggered this workflow four times at once, the v1.0.0 run finished
          # last, and it silently overwrote :7.2, :7.4 and :latest with a build
          # predating the OCI labels. Re-cutting any old patch release would do the
          # same thing without anyone force-pushing anything.
          newest="$(git tag -l 'v*' | sort -V | tail -1)"
          tags="${REGISTRY}/${IMAGE}:${{ matrix.redis }}-${v}"
          if [ "v${v}" = "$newest" ]; then
            tags="${tags},${REGISTRY}/${IMAGE}:${{ matrix.redis }}"
            echo "newest=yes" >> "$GITHUB_OUTPUT"
          else
            echo "newest=no" >> "$GITHUB_OUTPUT"
            echo "::notice::v${v} is not the newest tag ($newest) — publishing only the immutable tag, leaving :${{ matrix.redis }} alone"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: REDIS_VERSION=${{ matrix.redis }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  # `latest` follows the newest Redis in the matrix above, published only after
  # every matrix row succeeded.
  latest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0        # needs the tag list to know if this is newest

      # Same guard as the publish job: :latest must never move backwards.
      - id: guard
        run: |
          v="${GITHUB_REF_NAME#v}"
          newest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ "v${v}" = "$newest" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice::v${v} is not the newest tag ($newest) — leaving :latest alone"
          fi
      - if: steps.guard.outputs.go == 'yes'
        uses: docker/setup-qemu-action@v3
      - if: steps.guard.outputs.go == 'yes'
        uses: docker/setup-buildx-action@v3
      - if: steps.guard.outputs.go == 'yes'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.guard.outputs.go == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: REDIS_VERSION=7.4
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          push: true

  # The GitHub Release is a separate object from the tag, and it — not the tag
  # list — is what the repository page and the API call "Latest". Cutting a tag
  # without one leaves the front page advertising an older version: v1.2.0 was
  # tagged and published on 2026-09-01 and the page still offered v1.1.1.
  #
  # Runs after the images, so a release never advertises a version that cannot
  # be pulled yet.
  github-release:
    needs: [publish, latest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # needs the tag list to know if this is newest
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same guard as the jobs above: re-cutting an older tag gets its own
          # release, but must not take "Latest" away from a newer one.
          newest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then latest=true
          else
            latest=false
            echo "::notice::$GITHUB_REF_NAME is not the newest tag ($newest) — publishing it as an older release"
          fi

          # Notes written by hand are better than generated ones, so an existing
          # release is left exactly as it is; this only guarantees one exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already has a release — leaving it alone"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest="$latest"
